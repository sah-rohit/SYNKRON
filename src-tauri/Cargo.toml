[package]
name = "synkron-app"
version = "0.1.0"
description = "SYNKRON Desktop Core"
authors = ["SYNKRON Team"]
edition = "2021"

[build-dependencies]
cc = "1.0"

[dependencies]
tauri = "2.0"
tauri-build = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.4"
tokio = { version = "1", features = ["full"] }

[features]
# defaults
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
